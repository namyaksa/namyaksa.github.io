<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0f1638; --card:#1a2456; --text:#f1e4c0; --sub:#9aa3d1;
  --accent:#d4af37; --accent-light:#2a3570; --border:#2e3a72; --good:#5a8a5a; --bad:#c65b5b;
  --navy:#1a2456; --navy-deep:#0f1638;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1638; --card:#1a2456; --text:#f1e4c0; --sub:#9aa3d1;
    --accent:#d4af37; --accent-light:#2a3570; --border:#2e3a72;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1638; --card:#1a2456; --text:#f1e4c0; --sub:#9aa3d1;
  --accent:#d4af37; --accent-light:#2a3570; --border:#2e3a72;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);background-image:linear-gradient(180deg, var(--navy) 0px, var(--navy) 148px, transparent 148px);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,"Segoe UI",Roboto,sans-serif;min-height:100%;}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 60px;}
.titlebar{padding:6px 2px 16px;margin-bottom:16px;}
h1{font-size:1.4rem;margin:4px 0 2px;letter-spacing:-0.02em;color:#f1e4c0;}
.logo{font-family:'Pacifico','Brush Script MT',cursive;font-weight:400;font-size:2.3rem;line-height:1.15;margin:2px 0 2px;letter-spacing:0;}
.logo .lg-d{background:linear-gradient(180deg,#bfe0ff 0%,#6aaeff 55%,#3f86e8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 6px rgba(80,150,255,.35));}
.logo .lg-1{margin-left:.18em;font-size:1.15em;color:#e8f3ff;-webkit-text-fill-color:#e8f3ff;text-shadow:0 0 14px rgba(120,180,255,.55);}
.credit{font-size:0.88rem;color:#c9cdea;margin-bottom:0;line-height:1.5;}
.hanja{font-size:1.05rem;color:#d4af37;letter-spacing:0.35em;font-weight:700;margin:2px 0 4px;}
.syncstate{font-size:0.76rem;color:#9aa3d1;margin-top:10px;display:flex;align-items:center;gap:6px;}
.dot{width:7px;height:7px;border-radius:50%;background:#7fd68a;display:inline-block;}
.dot.off{background:#9aa3d1;}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:16px;}
.tab{flex:1;text-align:center;padding:9px 0;border-radius:9px;font-size:0.92rem;font-weight:600;color:var(--sub);cursor:pointer;user-select:none;}
.tab.active{background:var(--accent);color:#fff;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.stat{flex:1;min-width:80px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;text-align:center;}
.stat .n{font-size:1.3rem;font-weight:700;color:var(--accent);}
.stat .l{font-size:0.75rem;color:var(--sub);margin-top:2px;}
label{display:block;font-size:0.82rem;color:var(--sub);margin:10px 0 4px;font-weight:600;}
input[type=text],textarea{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:0.95rem;font-family:inherit;}
textarea{resize:vertical;min-height:44px;}
button{font-family:inherit;cursor:pointer;border:none;}
button:disabled{opacity:0.5;cursor:default;}
.btn-main{width:100%;margin-top:14px;background:var(--accent);color:#fff;padding:11px;border-radius:10px;font-size:0.95rem;font-weight:700;}
.lookup-btn{background:var(--accent-light);color:var(--accent);padding:7px 12px;border-radius:8px;font-size:0.82rem;font-weight:600;}
.lookup-status{font-size:0.78rem;color:var(--sub);margin-top:6px;}
.ipa-row{display:flex;align-items:center;gap:10px;margin-top:6px;}
.ipa-text{font-size:0.85rem;color:var(--sub);font-family:"Times New Roman",serif;}
.speak-btn{background:var(--accent-light);color:var(--accent);padding:5px 10px;border-radius:8px;font-size:0.78rem;font-weight:600;}
.w-word-row{display:flex;align-items:center;gap:8px;cursor:pointer;}
.w-ipa{font-size:0.78rem;color:var(--sub);font-family:"Times New Roman",serif;}
.word-item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);}
.word-item:last-child{border-bottom:none;}
.w-word{font-weight:700;font-size:1rem;}
.w-meaning{color:var(--sub);font-size:0.87rem;margin-top:2px;}
.w-ex{color:var(--sub);font-size:0.78rem;margin-top:4px;font-style:italic;}
.w-etym{color:var(--accent);font-size:0.92rem;line-height:1.5;margin-top:6px;background:var(--accent-light);padding:12px 14px;min-height:56px;border-radius:8px;text-align:left;}
.badge{font-size:0.7rem;padding:2px 7px;border-radius:20px;background:var(--accent-light);color:var(--accent);white-space:nowrap;margin-top:2px;display:inline-block;}
.edit-btn{background:none;color:var(--accent);font-size:0.78rem;padding:4px 6px;flex-shrink:0;}
.edit-form{padding:12px 0;border-bottom:1px solid var(--border);}
.edit-form label{margin:8px 0 3px;}
.edit-form .ef-btns{display:flex;gap:8px;margin-top:12px;}
.edit-form .ef-btns button{flex:1;padding:10px;border-radius:10px;font-weight:700;font-size:0.9rem;}
.ef-save{background:var(--accent);color:#0f1638;}
.ef-cancel{background:var(--accent-light);color:var(--sub);}
.ef-msg{font-size:0.78rem;color:#f2a5a5;margin-top:6px;min-height:16px;}
.del{background:none;color:var(--sub);font-size:0.78rem;padding:4px 6px;flex-shrink:0;}
.empty{text-align:center;color:var(--sub);padding:30px 10px;font-size:0.9rem;}
.qcard{text-align:center;padding:26px 16px;}
.qword{font-size:1.6rem;font-weight:800;margin-bottom:6px;}
.qhint{color:var(--sub);font-size:0.8rem;margin-bottom:20px;}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:9px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:0.92rem;}
.opt.correct{background:#213a21;border-color:var(--good);color:#9ad99a;}
.opt.wrong{background:#3a2121;border-color:var(--bad);color:#f2a5a5;}
:root[data-theme="dark"] .opt.correct,:root:not([data-theme="light"]) .opt.correct{background:#213a21;}
:root[data-theme="dark"] .opt.wrong,:root:not([data-theme="light"]) .opt.wrong{background:#3a2121;}
.qfeedback{min-height:22px;font-size:0.88rem;font-weight:600;margin-bottom:10px;}
.flash{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px 16px;text-align:center;min-height:140px;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;}
.flashrow{display:flex;gap:8px;margin-top:14px;}
.flashrow button{flex:1;padding:11px;border-radius:10px;font-weight:700;font-size:0.88rem;}
.know{background:var(--good);color:#fff;}
.dontknow{background:var(--bad);color:#fff;}
.stat.clickable{cursor:pointer;user-select:none;}
.stat.clickable:active{background:var(--accent-light);}
.filterbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.listsearch{position:relative;margin-bottom:12px;}
.listsearch input{padding-right:36px;}
#listSearchClear{position:absolute;right:6px;top:6px;width:28px;height:28px;border:none;border-radius:50%;background:var(--border);color:var(--text);font-size:.8rem;cursor:pointer;}
.ls-count{margin-top:6px;font-size:.78rem;color:var(--sub);}
.chip{background:var(--bg);color:var(--sub);border:1px solid var(--border);padding:6px 12px;border-radius:20px;font-size:0.8rem;font-weight:600;}
.chip.on{background:var(--accent);color:#0f1638;border-color:var(--accent);}
.progress{font-size:1rem;font-weight:700;color:var(--accent);text-align:center;margin-bottom:10px;}
.optn{display:inline-block;min-width:22px;height:22px;line-height:22px;margin-right:10px;border-radius:50%;background:var(--accent-light);color:var(--accent);font-size:0.78rem;font-weight:700;text-align:center;vertical-align:middle;}
.sent{padding:10px 0;border-bottom:1px solid var(--border);}
.sent:last-child{border-bottom:none;}
.sent .en{font-size:1.02rem;line-height:1.7;}
.sent .ko{font-size:0.86rem;line-height:1.55;color:var(--sub);margin-top:4px;}
.tok{cursor:pointer;border-radius:4px;padding:0 1px;}
select{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:0.95rem;font-family:inherit;}
.sent .rd{font-size:0.8rem;color:var(--sub);margin-top:2px;opacity:.9;}
.tok:active,.tok.sel{background:var(--accent-light);}
.tok.known{border-bottom:2px solid var(--accent);}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--border);box-shadow:0 -6px 20px rgba(0,0,0,0.18);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;border-radius:16px 16px 0 0;}
.sheet-ko{font-size:0.82rem;color:var(--sub);margin-bottom:8px;line-height:1.5;max-height:64px;overflow:auto;}
.sheet-btns{display:flex;gap:8px;margin-top:10px;align-items:center;}
.maker{display:flex;flex-direction:column;align-items:center;gap:8px;margin:28px auto 0;padding:18px 16px 0;border-top:1px solid var(--border);color:var(--sub);text-align:center;}
.maker-logo{width:170px;max-width:60%;height:auto;border-radius:10px;border:1px solid var(--accent);}
.maker-link{display:block;line-height:0;}
.maker-sub{font-size:0.72rem;}
</style>
</head>
<body>
<div class="wrap">
  <div class="titlebar">
    <h1 class="logo" aria-label="Daily 1"><span class="lg-d">Daily</span><span class="lg-1">1</span></h1>
    <div class="hanja">日新又日新</div>
    <div class="credit">1日1ページ、<br>昨日と違う今日、今日より良い明日のために…</div>
    <div class="syncstate" id="syncState"></div>
  </div>

  <div class="row">
    <div class="stat clickable" data-filter="all"><div class="n" id="statTotal">0</div><div class="l">全単語</div></div>
    <div class="stat clickable" data-filter="mastered"><div class="n" id="statMastered">0</div><div class="l">覚えた単語</div></div>
    <div class="stat clickable" data-filter="learning"><div class="n" id="statLearning">0</div><div class="l">復習中</div></div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="add">単語追加</div>
    <div class="tab" data-tab="list">単語帳</div>
    <div class="tab" data-tab="quiz">クイズ</div>
    <div class="tab" data-tab="scan" id="scanTab" style="display:none;">写真翻訳</div>
  </div>

  <div id="panel-add">
    <div class="card">
      <label>単語（英語・韓国語）</label>
      <input type="text" id="inWord" placeholder="例: ephemeral" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false">
      <div id="ipaRow" class="ipa-row" style="display:none;">
        <span id="ipaDisplay" class="ipa-text"></span>
        <button type="button" class="speak-btn" id="speakPreviewBtn">🔊 発音を聞く</button>
      </div>
      <div id="lookupRow" style="display:none;margin-top:6px;">
        <button type="button" class="lookup-btn" id="lookupBtn">🔍 辞書で意味を自動検索</button>
        <div id="lookupStatus" class="lookup-status"></div>
      </div>
      <label>意味</label>
      <textarea id="inMeaning" style="min-height:66px;" placeholder="例: はかない、つかの間の"></textarea>
      <label>語源（任意）</label>
      <textarea id="inEtymology" style="min-height:176px;" placeholder="ラテン語・ギリシャ語の語源、漢字語の成り立ちなど、覚えるのに役立つ由来"></textarea>
      <label>例文 — 本から書き写す（任意）</label>
      <textarea id="inExample" placeholder="読んでいる本でこの単語が出てきた文を書き写してみましょう" spellcheck="true" lang="en"></textarea>
      <div id="spellRow" style="display:none;margin-top:6px;">
        <button type="button" class="lookup-btn" id="spellBtn">✏️ スペルチェック</button>
        <div id="spellStatus" class="lookup-status"></div>
        <div id="spellSuggestions"></div>
      </div>
      <div id="translateRow" style="display:none;margin-top:6px;">
        <button type="button" class="lookup-btn" id="translateBtn">🌐 この文を翻訳する</button>
        <div id="translateStatus" class="lookup-status"></div>
      </div>
      <label>ページ（任意）</label>
      <input type="text" id="inPage" placeholder="例: p.42">
      <label>例文の訳（任意）</label>
      <textarea id="inExampleKo" placeholder="例文の日本語訳"></textarea>
      <button class="btn-main" id="addBtn">単語帳に保存</button>
    </div>
  </div>

  <div id="panel-list" style="display:none;">
    <div id="fillEtymRow" style="display:none;margin-bottom:10px;">
      <button type="button" class="lookup-btn" id="fillEtymBtn">🏛️ 保存済み単語の語源を補う</button>
      <div id="fillEtymStatus" class="lookup-status"></div>
    </div>
    <div class="card" id="listCard"></div>
  </div>
  <div id="panel-quiz" style="display:none;"><div class="card" id="quizCard"></div></div>

  <div id="panel-scan" style="display:none;">
    <div class="card">
      <label style="margin-top:0;" for="scanLang">文章の言語</label>
      <select id="scanLang">
        <option value="auto">自動判定</option>
        <option value="en">英語</option>
        <option value="ko">韓国語</option>
      </select>
      <div class="lookup-status">英語と韓国語に対応しています。写真を撮るか文章を貼り付けると、日本語に翻訳します。わからなければ「自動判定」のままで大丈夫です。</div>
    </div>
    <div class="card" id="scanPhotoCard" style="display:none;">
      <input type="file" id="scanFile" accept="image/*" style="display:none;">
      <button class="btn-main" id="scanPick" style="margin-top:0;">📷 写真を選ぶ</button>
      <img id="scanPreview" alt="" style="display:none;margin-top:10px;border-radius:10px;width:100%;max-height:220px;object-fit:contain;background:var(--bg);">
      <button class="btn-main" id="scanGo" style="display:none;">🌐 写真を翻訳する</button>
      <div id="scanStatus" class="lookup-status"></div>
    </div>
    <div class="card">
      <label style="margin-top:0;">原文を貼り付け</label>
      <textarea id="scanText" style="min-height:120px;" placeholder="ここに本文を貼り付けてください（1ページ分くらい）"></textarea>
      <div class="lookup-status">写真の選択ができないときは、iPhone・iPadは写真アプリで写真内の文字を長押ししてコピー（テキスト認識）、Androidは Google レンズの「テキストをコピー」を使ってください。</div>
      <button class="btn-main" id="scanTextGo">🌐 貼り付けた文章を翻訳する</button>
      <button type="button" class="lookup-btn" id="scanClear" style="margin-top:10px;">🗑️ 貼り付けた文章と翻訳を消す</button>
    </div>
    <div class="card" id="scanResult" style="display:none;"></div>
  </div>

<script>
let words = [];
let dbCap = null, userCap = null, sampleCap = null, uid = null, wordsCol = null;
const LS_KEY = 'vocab_words_v1'; // legacy local key, used for one-time migration

const LANGS = { en:{name:'英語',bcp:'en-US'}, ko:{name:'韓国語',bcp:'ko-KR'} };
let addLang = 'en'; // language of the word on the add screen
function speakWord(text, times, lang){
  times = times || 5;
  if(!('speechSynthesis' in window)) { alert('このブラウザは音声再生に対応していません。'); return; }
  window.speechSynthesis.cancel();
  for(let i=0;i<times;i++){
    const u = new SpeechSynthesisUtterance(text);
    u.lang = (LANGS[lang] || LANGS.en).bcp;
    u.rate = 0.9;
    window.speechSynthesis.speak(u);
  }
}

function autoGrow(el, min){
  el.style.height = 'auto';
  el.style.height = Math.max(min, el.scrollHeight + 4) + 'px';
}
function resizeFields(){
  autoGrow(document.getElementById('inMeaning'), 66);
  autoGrow(document.getElementById('inEtymology'), 176);
}
document.getElementById('inMeaning').addEventListener('input', ()=>autoGrow(document.getElementById('inMeaning'), 66));
document.getElementById('inEtymology').addEventListener('input', ()=>autoGrow(document.getElementById('inEtymology'), 176));

// 첫 글자만 대문자인 일반 단어(Ephemeral)는 소문자로 바꿔요. NASA처럼 여러 대문자가 있는 말은 그대로 둬요.
function lowerFirst(w){ return /^[A-Z][a-z'’-]*$/.test(w) ? w.charAt(0).toLowerCase()+w.slice(1) : w; }
let currentIpa = '';
let lastLookupWord = '';

async function doLookup(opts){
  opts = opts || {};
  const wordEl = document.getElementById('inWord');
  const meaningEl = document.getElementById('inMeaning');
  const etymEl = document.getElementById('inEtymology');
  const exampleEl = document.getElementById('inExample');
  const exampleKoEl = document.getElementById('inExampleKo');
  const statusEl = document.getElementById('lookupStatus');
  wordEl.value = lowerFirst(wordEl.value.trim());
  const w = wordEl.value;
  if(!w || !sampleCap) return;
  statusEl.textContent = '辞書で検索中…';
  document.getElementById('lookupBtn').disabled = true;
  try{
    const promptEn = `あなたは英語-日本語辞書です。次の英単語または短い表現を分析してください: "${w}"${opts.context ? '\nこの単語が使われている文: "' + opts.context.en + '"\n意味はこの文での使われ方を優先してください。' : ''}\n必ず次のJSON形式だけで答えてください。他のテキストや説明、マークダウンのコードブロックは付けず、純粋なJSONだけを出力してください。\n{"meaning": "日本語の意味。単語が動詞の活用形（過去形、過去分詞、-ing形、三人称単数形など）なら、必ず先頭に「[原形 - 過去形 - 過去分詞]」を書き（例: '[go - went - gone]'、規則動詞は '[walk - walked - walked]'）、続けてこの文での意味と原形の基本的な意味を簡潔に書く。活用形でなければ簡潔な日本語の意味だけ書く（複数の意味はカンマ区切り）。", "ipa": "国際音声記号（IPA）の発音表記。スラッシュ付き（例: /ɪˈfem.ər.əl/）", "etymology": "この単語のラテン語・ギリシャ語などの語源と、それを使って意味を覚えやすく説明する短い日本語の文（例: 'ラテン語 ephemerus（一日だけの）に由来。一日しか生きられないようにはかない、と覚えるとよい'）。語源が不明な表現なら空文字。", "example": "この単語を使った短く自然な英語の例文（自作。実在の本や著作物から引用しないこと）", "exampleKo": "上の例文の自然な日本語訳"}\nこの単語を知らない、または辞書にない表現なら {"meaning": "", "ipa": "", "etymology": "", "example": "", "exampleKo": ""} と答えてください。`;
    const ln = (LANGS[addLang]||LANGS.en).name;
    const promptOther = `あなたは韓国語-日本語辞書です。次の韓国語の単語または短い表現を分析してください: "${w}"${opts.context ? '\nこの単語が使われている文: "' + opts.context.en + '"\n意味はこの文での使われ方を優先してください。' : ''}\n必ず次のJSON形式だけで答えてください。他のテキストや説明、マークダウンのコードブロックは付けず、純粋なJSONだけを出力してください。\n{"meaning": "日本語の意味。動詞・形容詞の活用形なら先頭に「[辞書形]」を書き（例: '[가다]'）、続けてこの文での意味と辞書形の意味を簡潔に書く。そうでなければ簡潔な日本語の意味だけ書く（複数の意味はカンマ区切り）。", "ipa": "発音。実際の読み方をカタカナで書き、必要ならローマ字も添える（例: 학교 → ハッキョ / hakgyo）", "etymology": "漢字語なら元の漢字と日本語の漢字語との対応（例: 학교 = 学校）や覚え方を短い日本語で。固有語なら成り立ちや覚え方を短く。不明なら空文字。", "example": "この単語を使った短く自然な韓国語の例文（自作。実在の著作物から引用しないこと）", "exampleKo": "上の例文の自然な日本語訳"}\nこの単語を知らない、または辞書にない表現なら {"meaning": "", "ipa": "", "etymology": "", "example": "", "exampleKo": ""} と答えてください。`;
    const prompt = addLang === 'en' ? promptEn : promptOther;
    const result = await sampleCap.json(prompt);
    lastLookupWord = w;
    if(result && result.meaning){
      meaningEl.value = result.meaning;
      autoGrow(meaningEl, 66);
      if(result.etymology && !etymEl.value.trim()) etymEl.value = result.etymology;
      etymEl.style.height = 'auto'; etymEl.style.height = Math.max(176, etymEl.scrollHeight + 4) + 'px';
      if(opts.context){
        exampleEl.value = opts.context.en;
        exampleKoEl.value = opts.context.ko || '';
      } else {
        if(result.example) exampleEl.value = result.example;
        if(result.exampleKo) exampleKoEl.value = result.exampleKo;
      }
      currentIpa = result.ipa || '';
      const ipaRow = document.getElementById('ipaRow');
      if(currentIpa){ document.getElementById('ipaDisplay').textContent = currentIpa; ipaRow.style.display = 'flex'; }
      else { ipaRow.style.display = 'none'; }
      statusEl.textContent = '✓ 見つかりました。必要なら修正してください。';
      const has = exampleEl.value.trim().length > 0;
      document.getElementById('translateRow').style.display = (has && sampleCap) ? '' : 'none';
    } else {
      statusEl.textContent = '辞書に見つかりませんでした。直接入力してください。';
    }
  }catch(e){
    statusEl.textContent = '検索に失敗しました。直接入力してください。';
  }
  document.getElementById('lookupBtn').disabled = false;
  setTimeout(()=>{ statusEl.textContent = ''; }, 4000);
}

async function doSpellCheck(){
  const exEl = document.getElementById('inExample');
  const statusEl = document.getElementById('spellStatus');
  const suggEl = document.getElementById('spellSuggestions');
  const text = exEl.value.trim();
  if(!text || !sampleCap) return;
  statusEl.textContent = 'スペルを確認中…';
  suggEl.innerHTML = '';
  document.getElementById('spellBtn').disabled = true;
  try{
    const prompt = `次の英文にスペルミスがないか確認してください。文法や不自然な表現ではなく「明らかなスペルミス」だけを探してください。\n"${text}"\n必ず次のJSON形式だけで答えてください。他のテキストは付けず、純粋なJSONだけを出力してください。\n{"corrections": [{"original": "スペルミスのある単語", "suggestion": "正しい綴り"}]}\nスペルミスがなければ {"corrections": []} と答えてください。`;
    const result = await sampleCap.json(prompt);
    const corrections = (result && Array.isArray(result.corrections)) ? result.corrections : [];
    if(corrections.length === 0){
      statusEl.textContent = '✓ スペルミスはなさそうです。';
      setTimeout(()=>{ statusEl.textContent = ''; }, 3000);
    } else {
      statusEl.textContent = '';
      suggEl.innerHTML = corrections.map((c,i)=>
        `<button type="button" class="lookup-btn" data-i="${i}" style="margin:4px 4px 0 0;">${escapeHtml(c.original)} → ${escapeHtml(c.suggestion)}</button>`
      ).join('');
      suggEl.querySelectorAll('button').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const c = corrections[Number(btn.dataset.i)];
          const re = new RegExp('\\b' + c.original.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
          exEl.value = exEl.value.replace(re, c.suggestion);
          btn.disabled = true;
          btn.style.opacity = '0.5';
        });
      });
    }
  }catch(e){
    statusEl.textContent = 'スペルチェックに失敗しました。';
    setTimeout(()=>{ statusEl.textContent = ''; }, 3000);
  }
  document.getElementById('spellBtn').disabled = false;
}

async function doTranslateExample(){
  const exEl = document.getElementById('inExample');
  const koEl = document.getElementById('inExampleKo');
  const statusEl = document.getElementById('translateStatus');
  const text = exEl.value.trim();
  if(!text || !sampleCap) return;
  statusEl.textContent = '翻訳中…';
  document.getElementById('translateBtn').disabled = true;
  try{
    const prompt = `次の${(LANGS[addLang]||LANGS.en).name}の文を自然な日本語に翻訳してください。\n"${text}"\n必ず次のJSON形式だけで答えてください。他のテキストは付けず、純粋なJSONだけを出力してください。\n{"translation": "日本語訳"}`;
    const result = await sampleCap.json(prompt);
    if(result && result.translation){
      koEl.value = result.translation.trim();
      statusEl.textContent = '✓ 翻訳できました。必要なら修正してください。';
    } else {
      statusEl.textContent = '翻訳に失敗しました。直接入力してください。';
    }
  }catch(e){
    statusEl.textContent = '翻訳に失敗しました。直接入力してください。';
  }
  document.getElementById('translateBtn').disabled = false;
  setTimeout(()=>{ statusEl.textContent = ''; }, 4000);
}

}

function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderStats(){

// 탭을 떠날 때 스크롤 위치를 기억했다가, 돌아오면 공부하던 자리로 되돌려요.
let curTab = 'add';
const tabScroll = {};
function restoreScroll(name){
  const y = tabScroll[name];
  if(typeof y !== 'number') return;
  const go = ()=>window.scrollTo(0, y);
  go(); requestAnimationFrame(go); setTimeout(go, 60); setTimeout(go, 250);
}
function switchTab(name){
  if(name !== curTab){ tabScroll[curTab] = window.scrollY || document.documentElement.scrollTop || 0; }
  const prevTab = curTab; curTab = name;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
  document.getElementById('panel-add').style.display = name==='add' ? '' : 'none';
  document.getElementById('panel-list').style.display = name==='list' ? '' : 'none';
  document.getElementById('panel-quiz').style.display = name==='quiz' ? '' : 'none';
  document.getElementById('panel-scan').style.display = name==='scan' ? '' : 'none';
  if(name==='scan') renderScanResult();
  if(name==='list') renderList();
  if(name==='quiz') startQuiz();
  if(name!==prevTab){
    if(name==='scan' || name==='list') restoreScroll(name);
    else window.scrollTo(0, 0);
  }
}

async function addWordEntry(w, m, etym, ex, exKo, ipa, page){
  const data = { lang: addLang, word: w, meaning: m, ipa: ipa || '', etymology: etym || '', example: ex || '', exampleKo: exKo || '', page: page || '', mastered: false, correctStreak: 0, addedAt: Date.now() };

    try{ await wordsCol.add(data); }catch(e){ alert('保存に失敗しました。しばらくしてからもう一度お試しください。'); }
  } else {
    words.unshift({ id: 'local_'+Date.now().toString(36)+Math.random().toString(36).slice(2), ...data });

  }
}

async function deleteWord(id){
  if(wordsCol){
    try{ await wordsCol.doc(id).delete(); }catch(e){}
  } else {
    words = words.filter(w=>w.id!==id);
    saveLocal(); renderStats(); renderList();
  }
}

async function updateWord(id, patch){
  const w = words.find(x=>x.id===id);
  if(!w) return;
  Object.assign(w, patch);
  if(wordsCol){
    try{ await wordsCol.doc(id).update(patch); }catch(e){}

    saveLocal();
  }
  renderStats();
}

async function fillMissingEtymology(){
  const missing = words.filter(w=>!w.etymology || !w.etymology.trim());

  const btn = document.getElementById('fillEtymBtn');

  let done = 0;
  for(const w of missing){
    statusEl.textContent = `${w.word} の語源を検索中… (${done+1}/${missing.length})`;
    try{
      const prompt = `あなたは語源辞書です。次の${(LANGS[w.lang]||LANGS.en).name}の単語の語源（ラテン語・ギリシャ語、漢字語なら元の漢字など）を教えてください: "${w.word}"\n必ず次のJSON形式だけで答えてください。他のテキストは付けず、純粋なJSONだけを出力してください。\n{"etymology": "この単語の語源と、それを使って意味を覚えやすく説明する短い日本語の文。語源が不明なら空文字。"}`;

// --- Page scan: photo of a book page -> sentence-by-sentence translation, tap words to save ---
let scanFile = null, scanSentences = [], scanImagesOk = null, returnToScan = false;

function cleanToken(t){ return (t||'').replace(/^[^\p{L}\p{M}]+|[^\p{L}\p{M}]+$/gu,''); }
// 일본어는 띄어쓰기가 없어서 브라우저의 단어 나누기(Intl.Segmenter)로 나눠요.
function splitTokens(text, lang){
  if(false){
    try{ const seg = new Intl.Segmenter(lang, {granularity:'word'}); return Array.from(seg.segment(text)).map(x=>({t:x.segment, w:!!x.isWordLike})); }catch(e){}
  }
  return text.split(/(\s+)/).map(t=>({t, w:/\S/.test(t)}));
}
function isKnownWord(w){ const l = w.toLowerCase(); return words.some(x=>(x.word||'').toLowerCase()===l); }
// Tapping a word jumps to the add-word tab, pre-filled and looked up in the context of that sentence.
function goAddWord(word, idx){
  const s = scanSentences[idx];
  ['inMeaning','inEtymology','inExample','inExampleKo','inPage'].forEach(id=>{ document.getElementById(id).value = ''; });
  addLang = (s && LANGS[s.lang]) ? s.lang : 'en';
  document.getElementById('inWord').value = lowerFirst(word);
  document.getElementById('ipaRow').style.display = 'none';
  document.getElementById('spellRow').style.display = 'none';
  document.getElementById('translateRow').style.display = 'none';
  document.getElementById('spellSuggestions').innerHTML = '';
  currentIpa = '';
  lastLookupWord = '';
  resizeFields();
  switchTab('add');
  returnToScan = true;
  window.scrollTo(0, 0);
  doLookup({ silent: true, context: s });
}

// The pasted text and its translation are kept in this browser, so leaving the page or a reload doesn't lose them.
const SCAN_KEY = 'vocab_scan_v1';
function saveScan(){
  try{
    localStorage.setItem(SCAN_KEY, JSON.stringify({ text: document.getElementById('scanText').value, sentences: scanSentences, sel: document.getElementById('scanLang').value }));
  }catch(e){}
}
function loadScan(){
  try{
    const raw = localStorage.getItem(SCAN_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    if(d && typeof d.text === 'string') document.getElementById('scanText').value = d.text;
    if(d && Array.isArray(d.sentences)) scanSentences = d.sentences.filter(s=>s && s.en);
    if(d && typeof d.sel === 'string' && document.getElementById('scanLang').querySelector('option[value="'+d.sel+'"]')) document.getElementById('scanLang').value = d.sel;
    renderScanResult();
  }catch(e){}
}
function clearScan(){
  scanSentences = [];
  document.getElementById('scanText').value = '';
  document.getElementById('scanStatus').textContent = '';
  try{ localStorage.removeItem(SCAN_KEY); }catch(e){}
  renderScanResult();
}

function renderScanResult(){
  saveScan();
  const el = document.getElementById('scanResult');
  if(scanSentences.length===0){ el.style.display='none'; return; }
  el.style.display = '';
  el.innerHTML = '<div class="qhint" style="text-align:left;margin-bottom:6px;">わからない単語をタップすると単語追加画面に移ります。保存するとこの画面に戻ります。下線は保存済みの単語です。</div>' +
    scanSentences.map((s,i)=>{
      const toks = splitTokens(s.en, s.lang).map(x=>{
        if(!x.w) return escapeHtml(x.t);
        const c = cleanToken(x.t);
        if(!c) return escapeHtml(x.t);
        return `<span class="tok${isKnownWord(c)?' known':''}" data-i="${i}">${escapeHtml(x.t)}</span>`;
      }).join('');
      const rtl = '';
      return `<div class="sent"><div class="en"${rtl}>${toks}</div>${s.read ? `<div class="rd">${escapeHtml(s.read)}</div>` : ''}<div class="ko">${escapeHtml(s.ko||'')}</div></div>`;
    }).join('');
}

function scanPrompt(sel, isPhoto){
  const hint = sel==='auto' ? '文章の言語は英語または韓国語です。自分で判別してください。' : '文章の言語は' + LANGS[sel].name + 'です。';
  const head = isPhoto ? 'この写真は、ユーザーが持っている外国語の本や文書の1ページです。写真の本文を読み取り、' : '次は、ユーザーが持っている外国語の本や文書の1ページ分の文章です。文章を';
  return head + ' 個人の学習用に、文ごとに分けて、それぞれに自然な日本語訳を付けてください。' + hint + ' ページ番号、ヘッダー、フッターなど本文でないものは除いてください。改行やハイフンで途切れた単語はつなげて読んでください。韓国語の文は、全体の発音をカタカナで "read" に書いてください。英語の場合、read は空文字にしてください。文章が読み取れないときは sentences を空の配列にしてください。\n必ず次のJSON形式だけで答えてください。他のテキストは付けず、純粋なJSONだけを出力してください。\n{"language": "en または ko", "sentences": [{"en": "原文の文（元の言語のまま）", "ko": "日本語訳", "read": "読み方（韓国語はカタカナ発音）または空文字"}]}';
}
function parseScan(result, sel){
  const list = (result && Array.isArray(result.sentences)) ? result.sentences.filter(s=>s && s.en) : [];
  const lang = LANGS[result && result.language] ? result.language : (LANGS[sel] ? sel : 'en');
  return list.map(s=>({ en: String(s.en), ko: String(s.ko||''), read: String(s.read||''), lang }));
}
async function doScan(){
  if(!scanFile || !sampleCap) return;
  const statusEl = document.getElementById('scanStatus');
  const btn = document.getElementById('scanGo');
  btn.disabled = true;
  statusEl.textContent = '写真の文章を読み取って翻訳中…（10〜40秒かかります）';
  try{
    const sel = document.getElementById('scanLang').value;
    const prompt = scanPrompt(sel, true);
    const result = await sampleCap.json(prompt, { images: scanFile });
    scanSentences = parseScan(result, sel);
    if(scanSentences.length===0) statusEl.textContent = '文章を読み取れませんでした。明るく鮮明に、文字が画面いっぱいになるように撮り直してみてください。';
    else statusEl.textContent = `✓ ${scanSentences.length}文を翻訳しました。`;
    renderScanResult();
  }catch(e){
    const code = e && e.code;
    statusEl.textContent = code==='image_rejected' ? 'この写真は使えません。別の写真でお試しください。'
      : code==='rate_limited' ? '利用上限に達しました。少し待ってからもう一度お試しください。'
      : code==='images_unavailable' ? 'この画面では写真の読み取りは使えません。'
      : '読み取りに失敗しました。もう一度お試しください。';
  }
  btn.disabled = false;
}
document.getElementById('scanGo').addEventListener('click', doScan);

async function doScanText(){
  const text = document.getElementById('scanText').value.trim();
  if(!text || !sampleCap) return;
  const statusEl = document.getElementById('scanStatus');
  const btn = document.getElementById('scanTextGo');
  btn.disabled = true;
  statusEl.textContent = '文ごとに翻訳中…（10〜40秒かかります）';
  try{
    const sel = document.getElementById('scanLang').value;
    const prompt = scanPrompt(sel, false) + '\n\n文章:\n' + text.slice(0, 6000);
    const result = await sampleCap.json(prompt);
    scanSentences = parseScan(result, sel);
    statusEl.textContent = scanSentences.length ? `✓ ${scanSentences.length}文を翻訳しました。` : '翻訳する文が見つかりませんでした。';
    renderScanResult();
  }catch(e){
    statusEl.textContent = (e && e.code==='rate_limited') ? '利用上限に達しました。少し待ってからもう一度お試しください。' : '翻訳に失敗しました。もう一度お試しください。';
  }
  btn.disabled = false;
}
document.getElementById('scanTextGo').addEventListener('click', doScanText);
document.getElementById('scanText').addEventListener('input', saveScan);
document.getElementById('scanLang').addEventListener('change', saveScan);
// 확인 없이 버튼을 누르면 바로 지워요.
document.getElementById('scanClear').addEventListener('click', clearScan);
// ---- 업데이트 확인: 링크로 나가지 않고 이 안에서 바로 알려줘요 ----
const APP_VERSION = '20261103';
(function(){ const v=document.getElementById('appVer'); if(v) v.textContent='バージョン v'+APP_VERSION.slice(0,4)+'.'+APP_VERSION.slice(4,6)+'.'+APP_VERSION.slice(6,8); })();
const NOTICE_URL = 'https://namyaksa.github.io/study/index.html#ja';

  if(back) back.remove();
  back = document.createElement('div');
  back.id = 'updBack';
  back.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;';
  const box = document.createElement('div');
  box.style.cssText = 'background:#1a2456;color:#f1e4c0;border:1px solid #d4af37;border-radius:16px;max-width:380px;width:100%;padding:22px 20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5);';
  const h = document.createElement('div'); h.textContent = title; h.style.cssText = 'font-size:1.1rem;font-weight:800;margin-bottom:10px;';
  const m = document.createElement('div'); m.textContent = msg; m.style.cssText = 'font-size:.95rem;line-height:1.7;color:#f1e4c0;';
  box.appendChild(h); box.appendChild(m);
  if(withLink){
    const a = document.createElement('a'); a.href = NOTICE_URL; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.textContent = '詳しい案内を見る'; a.style.cssText = 'display:block;margin-top:12px;color:#9ad0ff;font-size:.9rem;';
    box.appendChild(a);
  }
  const ok = document.createElement('button'); ok.type = 'button'; ok.textContent = 'OK';
  ok.style.cssText = 'margin-top:14px;width:100%;background:#d4af37;color:#0f1638;border:none;border-radius:10px;padding:11px;font-size:1rem;font-weight:800;cursor:pointer;';
  ok.addEventListener('click', ()=>back.remove());
  box.appendChild(ok); back.appendChild(box);
  back.addEventListener('click', e=>{ if(e.target===back) back.remove(); });
  document.body.appendChild(back);
}
(function(){
  const link = document.querySelector('.maker-link'); if(!link) return;
  link.addEventListener('click', async (e)=>{
    e.preventDefault();
    try{
      const r = await fetch('https://namyaksa.github.io/study/version-ja.json?_=' + Date.now(), {cache:'no-store'});
      if(!r.ok) throw new Error('http');

      }
    }catch(err){
      window.open(NOTICE_URL, '_blank', 'noopener');

})();


document.getElementById('scanResult').addEventListener('click', (e)=>{
  const t = e.target.closest && e.target.closest('.tok');
  if(!t) return;
  const c = cleanToken(t.textContent);
  if(!c) return;

// Quiz logic
let quizPool = [], quizIndex = 0, quizScore = 0, quizMode = 'choice';
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function startQuiz(){
  if(words.length===0){ document.getElementById('quizCard').innerHTML = '<div class="empty">クイズをするには、まず単語を追加してください。</div>'; return; }
  const learning = words.filter(w=>!w.mastered);
  quizPool = shuffle(learning.length>=3 ? learning : words).slice(0,10);
  quizIndex = 0; quizScore = 0;
  quizMode = words.length >= 4 ? 'choice' : 'flash';
  renderQuizStep();
}

function renderQuizStep(){
  const el = document.getElementById('quizCard');
  if(quizIndex >= quizPool.length){
    el.innerHTML = `<div class="qcard"><div class="qword">🎉 完了！</div><div class="qhint">${quizPool.length}問中 ${quizScore}問正解しました</div><button class="btn-main" id="retryBtn">もう一度</button></div>`;
    document.getElementById('retryBtn').addEventListener('click', startQuiz);
    return;
  }
  const cur = quizPool[quizIndex];
  const progressHtml = `<div class="progress">問題 ${quizIndex+1} / ${quizPool.length}</div>`;

  if(quizMode === 'choice'){
    const distractors = shuffle(words.filter(w=>w.id!==cur.id)).slice(0,3).map(w=>w.meaning);
    const options = shuffle([cur.meaning, ...distractors]);
    el.innerHTML = progressHtml + `<div class="qcard"><div class="qword">${escapeHtml(cur.word)} <span class="speak-btn" id="qSpeak">🔊</span></div>${cur.ipa?`<div class="ipa-text" style="margin-bottom:10px;">${escapeHtml(cur.ipa)}</div>`:''}<div class="qhint">この単語の意味は？</div><div id="qfeedback" class="qfeedback"></div><div id="opts">${options.map((o,i)=>`<button class="opt" data-val="${escapeHtml(o)}"><span class="optn">${i+1}</span>${escapeHtml(o)}</button>`).join('')}</div></div>`;
    document.getElementById('qSpeak').addEventListener('click', ()=>speakWord(cur.word, 5, cur.lang));
    document.querySelectorAll('.opt').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const isCorrect = btn.dataset.val === cur.meaning;
        document.querySelectorAll('.opt').forEach(b=>{
          b.disabled = true;
          if(b.dataset.val === cur.meaning) b.classList.add('correct');
          else if(b===btn) b.classList.add('wrong');
        });
        handleAnswer(cur, isCorrect);
        document.getElementById('qfeedback').textContent = isCorrect ? '正解です！👍' : `残念。正解は「${cur.meaning}」`;
        setTimeout(()=>{ quizIndex++; renderQuizStep(); }, 1100);
      });
    });
  } else {
    el.innerHTML = progressHtml + `<div class="flash" id="flashCard"><div class="qword">${escapeHtml(cur.word)} <span class="speak-btn" id="qSpeak2">🔊</span></div>${cur.ipa?`<div class="ipa-text">${escapeHtml(cur.ipa)}</div>`:''}<div class="qhint" id="flashHint">タップして意味を見る</div></div><div class="flashrow" id="flashBtns" style="display:none;"><button class="dontknow" id="btnNo">まだわからない</button><button class="know" id="btnYes">わかる！</button></div>`;
    document.getElementById('qSpeak2').addEventListener('click', (e)=>{ e.stopPropagation(); speakWord(cur.word, 5, cur.lang); });
    let flipped = false;
    document.getElementById('flashCard').addEventListener('click', ()=>{
      if(flipped) return; flipped = true;
      document.getElementById('flashCard').innerHTML = `<div class="w-meaning" style="font-size:1.1rem;">${escapeHtml(cur.meaning)}</div>${cur.etymology?`<div class="w-etym">🏛️ ${escapeHtml(cur.etymology)}</div>`:''}${cur.example?`<div class="w-ex" style="margin-top:8px;">"${escapeHtml(cur.example)}"</div>`:''}${cur.exampleKo?`<div class="w-ex">→ ${escapeHtml(cur.exampleKo)}</div>`:''}`;
      document.getElementById('flashBtns').style.display = 'flex';
    });
    document.getElementById('btnYes').addEventListener('click', ()=>{ handleAnswer(cur, true); quizIndex++; renderQuizStep(); });
    document.getElementById('btnNo').addEventListener('click', ()=>{ handleAnswer(cur, false); quizIndex++; renderQuizStep(); });
  }
}

function handleAnswer(word, correct){
  const w = words.find(x=>x.id===word.id);
  if(!w) return;
  let streak = correct ? (w.correctStreak||0)+1 : 0;
  let mastered = correct ? (!!w.mastered || streak >= 5) : false; // 5 correct in a row = mastered
  quizScore += correct ? 1 : 0;
  updateWord(w.id, { correctStreak: streak, mastered });
}

// --- local fallback (no db/user capability available) ---
function loadLocal(){
  try{ const raw = localStorage.getItem(LS_KEY); words = raw ? JSON.parse(raw) : []; }catch(e){ words = []; }
}
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(words)); }catch(e){} }

// --- init: try cross-device sync, fall back to local storage ---
async function init(){
  loadLocal(); renderStats(); // paint immediately from whatever local cache exists
  loadScan();

  try{
    userCap = await claude.use('user');
    dbCap = await claude.use('db');
    sampleCap = await claude.use('sample');
  }catch(e){}

  if(sampleCap) document.getElementById('lookupRow').style.display = '';
  if(sampleCap){
    document.getElementById('scanTab').style.display = '';
    try{
      const lim = await sampleCap.limits();
      scanImagesOk = !!(lim && lim.images);
      if(scanImagesOk) document.getElementById('scanPhotoCard').style.display = '';
    }catch(e){ scanImagesOk = false; }
  }

  if(!userCap || !dbCap){ setSyncState('local'); return; }

  uid = await userCap.id();
  if(!uid){ setSyncState('local'); return; }

  wordsCol = dbCap.collection('data/users/' + uid);
  setSyncState('synced');

  let migrated = false;
  wordsCol.orderBy('addedAt', 'desc').onSnapshot(async (snap)=>{
    if(!migrated && snap.empty){
      migrated = true;
      const legacy = words.filter(w=>String(w.id).startsWith('local_'));
      for(const w of legacy){
        try{ await wordsCol.add({ word:w.word, meaning:w.meaning, ipa:w.ipa||'', etymology:w.etymology||'', example:w.example||'', exampleKo:w.exampleKo||'', mastered:!!w.mastered, correctStreak:w.correctStreak||0, addedAt:w.addedAt||Date.now() }); }catch(e){}
      }
      return; // the migration writes will trigger a fresh snapshot
    }
    migrated = true;
    words = snap.docs.map(d=>({ id: d.id, ...d.data() }));
    renderStats();
    if(document.getElementById('panel-list').style.display !== 'none') renderList();
  }, (err)=>{ setSyncState('local'); });
}
init();
</script>
