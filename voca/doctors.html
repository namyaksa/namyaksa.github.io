<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>단어 수집장 — Doctors, Erich Segal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%98%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f1e8; --card:#ffffff; --text:#1a1f3d; --sub:#5c6285;
  --accent:#b8860b; --accent-light:#f1e4c0; --border:#ddd5be; --good:#5a8a5a; --bad:#c65b5b;
  --navy:#1a2456;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1638; --card:#1a2456; --text:#f1e4c0; --sub:#9aa3d1; --accent:#d4af37; --accent-light:#2a3570; --border:#2e3a72; }
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);background-image:linear-gradient(180deg, var(--navy) 0px, var(--navy) 148px, transparent 148px);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 60px;}
.titlebar{padding:6px 2px 16px;margin-bottom:16px;}
h1{font-size:1.4rem;margin:4px 0 2px;color:#f1e4c0;}
.credit{font-size:0.88rem;color:#c9cdea;}
.authbar{font-size:0.8rem;color:#9aa3d1;margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.authbar button{padding:6px 12px;border-radius:8px;border:none;font-size:0.8rem;font-weight:600;cursor:pointer;}
.signin-btn{background:#fff;color:#1a1f3d;}
.signout-btn{background:transparent;color:#9aa3d1;text-decoration:underline;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.stat{flex:1;min-width:80px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;text-align:center;}
.stat .n{font-size:1.3rem;font-weight:700;color:var(--accent);}
.stat .l{font-size:0.75rem;color:var(--sub);margin-top:2px;}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:16px;}
.tab{flex:1;text-align:center;padding:9px 0;border-radius:9px;font-size:0.92rem;font-weight:600;color:var(--sub);cursor:pointer;user-select:none;}
.tab.active{background:var(--accent);color:#fff;}
label{display:block;font-size:0.82rem;color:var(--sub);margin:10px 0 4px;font-weight:600;}
input[type=text],textarea{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:0.95rem;font-family:inherit;}
textarea{resize:vertical;min-height:44px;}
button{font-family:inherit;cursor:pointer;border:none;}
button:disabled{opacity:0.5;}
.btn-main{width:100%;margin-top:14px;background:var(--accent);color:#fff;padding:11px;border-radius:10px;font-size:0.95rem;font-weight:700;}
.lookup-btn{background:var(--accent-light);color:var(--accent);padding:7px 12px;border-radius:8px;font-size:0.82rem;font-weight:600;}
.lookup-status{font-size:0.78rem;color:var(--sub);margin-top:6px;}
.example-suggestions{margin-top:6px;}
.sugg-label{font-size:0.75rem;color:var(--sub);margin-bottom:4px;}
.sugg-btn{display:block;width:100%;text-align:left;background:var(--accent-light);color:var(--text);padding:8px 10px;border-radius:8px;font-size:0.8rem;margin-bottom:6px;line-height:1.4;}
.ipa-row{display:flex;align-items:center;gap:10px;margin-top:6px;}
.ipa-text{font-size:0.85rem;color:var(--sub);font-family:"Times New Roman",serif;}
.speak-btn{background:var(--accent-light);color:var(--accent);padding:5px 10px;border-radius:8px;font-size:0.78rem;font-weight:600;}
.w-word-row{display:flex;align-items:center;gap:8px;cursor:pointer;}
.w-word{font-weight:700;font-size:1rem;}
.w-ipa{font-size:0.78rem;color:var(--sub);font-family:"Times New Roman",serif;}
.w-meaning{color:var(--sub);font-size:0.87rem;margin-top:2px;}
.w-ex{color:var(--sub);font-size:0.78rem;margin-top:4px;font-style:italic;}
.badge{font-size:0.7rem;padding:2px 7px;border-radius:20px;background:var(--accent-light);color:var(--accent);display:inline-block;margin-top:2px;}
.word-item{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);}
.word-item:last-child{border-bottom:none;}
.del{background:none;color:var(--sub);font-size:0.78rem;}
.empty{text-align:center;color:var(--sub);padding:30px 10px;font-size:0.9rem;}
.qcard{text-align:center;padding:26px 16px;}
.qword{font-size:1.6rem;font-weight:800;margin-bottom:6px;}
.qhint{color:var(--sub);font-size:0.8rem;margin-bottom:20px;}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:9px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:0.92rem;}
.opt.correct{background:#e4f2e4;border-color:var(--good);color:var(--good);}
.opt.wrong{background:#f7e4e4;border-color:var(--bad);color:var(--bad);}
.qfeedback{min-height:22px;font-size:0.88rem;font-weight:600;margin-bottom:10px;}
.flash{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px 16px;text-align:center;min-height:140px;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;}
.flashrow{display:flex;gap:8px;margin-top:14px;}
.flashrow button{flex:1;padding:11px;border-radius:10px;font-weight:700;font-size:0.88rem;}
.know{background:var(--good);color:#fff;}
.dontknow{background:var(--bad);color:#fff;}
.progress{font-size:0.8rem;color:var(--sub);text-align:center;margin-bottom:10px;}
.gate{text-align:center;padding:60px 20px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="titlebar">
    <h1>📘 단어 수집장</h1>
    <div class="credit">Erich Segal의 「Doctors」, 다섯 번째 영어 원서와 함께 ✒️</div>
    <div class="authbar" id="authbar"></div>
  </div>

  <div id="gate" class="gate" style="display:none;">
    <p>구글 계정으로 로그인하면 단어장이 저장돼요.</p>
  </div>

  <div id="app" style="display:none;">
    <div class="row">
      <div class="stat"><div class="n" id="statTotal">0</div><div class="l">전체 단어</div></div>
      <div class="stat"><div class="n" id="statMastered">0</div><div class="l">외운 단어</div></div>
      <div class="stat"><div class="n" id="statLearning">0</div><div class="l">복습 중</div></div>
    </div>
    <div class="tabs">
      <div class="tab active" data-tab="add">단어 추가</div>
      <div class="tab" data-tab="list">단어장</div>
      <div class="tab" data-tab="quiz">퀴즈</div>
    </div>
    <div id="panel-add">
      <div class="card">
        <label>영어 단어</label>
        <input type="text" id="inWord" placeholder="예: ephemeral">
        <div id="ipaRow" class="ipa-row" style="display:none;">
          <span id="ipaDisplay" class="ipa-text"></span>
          <button type="button" class="speak-btn" id="speakPreviewBtn">🔊 발음 듣기</button>
        </div>
        <div id="lookupRow" style="margin-top:6px;">
          <button type="button" class="lookup-btn" id="lookupBtn">🔍 사전에서 자동으로 찾기 (영어)</button>
          <div id="lookupStatus" class="lookup-status"></div>
        </div>
        <label>뜻 (한글)</label>
        <input type="text" id="inMeaning" placeholder="예: 덧없는, 순간적인">
        <label>예문 — 책에서 직접 옮겨 적기 (선택)</label>
        <textarea id="inExample" placeholder="본인이 읽던 책에서 이 단어가 나온 문장을 직접 옮겨 적어보세요"></textarea>
        <div id="exampleSuggestions" class="example-suggestions"></div>
        <label>페이지 (선택)</label>
        <input type="text" id="inPage" placeholder="예: p.42">
        <label>예문 해석 (선택)</label>
        <textarea id="inExampleKo" placeholder="예문의 한글 번역"></textarea>
        <button class="btn-main" id="addBtn">단어장에 저장</button>
      </div>
    </div>
    <div id="panel-list" style="display:none;"><div class="card" id="listCard"></div></div>
    <div id="panel-quiz" style="display:none;"><div class="card" id="quizCard"></div></div>
  </div>
</div>

<!--
  ============================================================
  설정 방법 (README)
  ============================================================
  1) https://console.firebase.google.com 에서 새 프로젝트 생성
  2) 프로젝트 설정 > 일반 > "웹 앱 추가" 로 config 값을 받아
     아래 firebaseConfig 객체에 붙여넣기
  3) Authentication > Sign-in method > Google 사용 설정
  4) Firestore Database 만들기 (프로덕션 모드) 후 아래 보안 규칙 적용:
       rules_version = '2';
       service cloud.firestore {
         match /databases/{database}/documents {
           match /users/{uid}/words/{wordId} {
             allow read, write: if request.auth != null && request.auth.uid == uid;
           }
         }
       }
  5) 배포: Firebase Hosting(`firebase deploy`), GitHub Pages 등
     실제 https 도메인이 있어야 구글 로그인 팝업이 동작합니다.
     (Authentication > Settings > 승인된 도메인에 호스팅 도메인 추가)
  ============================================================
-->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, updateDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ▼▼▼ 여기에 본인 Firebase 프로젝트의 config 값을 붙여넣으세요 ▼▼▼
const firebaseConfig = {
  apiKey: "AIzaSyBTXF7Wv7UWAD6Uq2b61QJ48NE_XzLLLWU",
  authDomain: "vocab-doctors-erichsegal.firebaseapp.com",
  projectId: "vocab-doctors-erichsegal",
  storageBucket: "vocab-doctors-erichsegal.firebasestorage.app",
  messagingSenderId: "9672562348",
  appId: "1:9672562348:web:365cbd540806b3c78a7109"
};
// ▲▲▲ ------------------------------------------------- ▲▲▲

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let words = [];
let wordsColRef = null;
let currentIpa = '';

function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function speakWord(text, times){
  times = times || 5;
  if(!('speechSynthesis' in window)) { alert('이 브라우저는 음성 재생을 지원하지 않아요.'); return; }
  window.speechSynthesis.cancel();
  for(let i=0;i<times;i++){
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.9;
    window.speechSynthesis.speak(u);
  }
}

// --- Auth ---
function renderAuthbar(user){
  const el = document.getElementById('authbar');
  if(user){
    el.innerHTML = `<span>👤 ${escapeHtml(user.displayName || user.email)}</span><button class="signout-btn" id="signOutBtn">로그아웃</button>`;
    document.getElementById('signOutBtn').addEventListener('click', ()=>signOut(auth));
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = '';
  } else {
    el.innerHTML = `<button class="signin-btn" id="signInBtn">🔵 구글 계정으로 로그인</button>`;
    document.getElementById('signInBtn').addEventListener('click', async ()=>{
      try{ await signInWithPopup(auth, provider); }
      catch(e){ alert('로그인에 실패했어요: ' + e.message); }
    });
    document.getElementById('gate').style.display = '';
    document.getElementById('app').style.display = 'none';
  }
}

onAuthStateChanged(auth, (user)=>{
  renderAuthbar(user);
  if(user){
    wordsColRef = collection(db, 'users', user.uid, 'words');
    const q = query(wordsColRef, orderBy('addedAt', 'desc'));
    onSnapshot(q, (snap)=>{
      words = snap.docs.map(d=>({ id: d.id, ...d.data() }));
      renderStats();
      if(document.getElementById('panel-list').style.display !== 'none') renderList();
    });
  } else {
    words = []; wordsColRef = null; renderStats();
  }
});

// --- Dictionary auto-lookup (free public API, English definition + phonetic) ---
async function doLookup(){
  const w = document.getElementById('inWord').value.trim();
  const meaningEl = document.getElementById('inMeaning');
  const statusEl = document.getElementById('lookupStatus');
  const suggEl = document.getElementById('exampleSuggestions');
  if(!w) return;
  statusEl.textContent = '사전에서 찾는 중...';
  suggEl.innerHTML = '';
  document.getElementById('lookupBtn').disabled = true;
  try{
    const res = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(w));
    if(!res.ok) throw new Error('not found');
    const data = await res.json();
    const entry = data[0];
    const phonetic = entry.phonetic || (entry.phonetics && entry.phonetics.find(p=>p.text)?.text) || '';
    const def = entry.meanings?.[0]?.definitions?.[0]?.definition || '';
    currentIpa = phonetic;
    const ipaRow = document.getElementById('ipaRow');
    if(phonetic){ document.getElementById('ipaDisplay').textContent = phonetic; ipaRow.style.display = 'flex'; }
    else ipaRow.style.display = 'none';
    if(def && !meaningEl.value.trim()){
      // Free API returns English definitions; try a lightweight machine translation to Korean.
      try{
        const trRes = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(def) + '&langpair=en|ko');
        const trData = await trRes.json();
        meaningEl.value = trData?.responseData?.translatedText || def;
      }catch(e){ meaningEl.value = def; }
    }
    // Collect up to 2 example sentences from the dictionary (general usage examples,
    // not taken from any novel) so the person has an option besides their own book excerpt.
    const examples = [];
    (entry.meanings || []).forEach(m=>{
      (m.definitions || []).forEach(d=>{ if(d.example && examples.length < 2 && !examples.includes(d.example)) examples.push(d.example); });
    });
    if(examples.length){
      suggEl.innerHTML = '<div class="sugg-label">예문 추천 (사전 제공, 책 원문 아님) — 눌러서 적용:</div>' +
        examples.map((ex,i)=>`<button type="button" class="sugg-btn" data-ex="${escapeHtml(ex)}">${escapeHtml(ex)}</button>`).join('');
      suggEl.querySelectorAll('.sugg-btn').forEach(b=>{
        b.addEventListener('click', async ()=>{
          document.getElementById('inExample').value = b.dataset.ex;
          try{
            const trRes = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(b.dataset.ex) + '&langpair=en|ko');
            const trData = await trRes.json();
            document.getElementById('inExampleKo').value = trData?.responseData?.translatedText || '';
          }catch(e){}
        });
      });
    }
    statusEl.textContent = phonetic || def ? '✓ 찾았어요. 필요하면 수정해주세요. (자동 번역은 참고용)' : '사전에서 찾지 못했어요.';
  }catch(e){
    statusEl.textContent = '사전에서 찾지 못했어요. 직접 입력해주세요.';
  }
  document.getElementById('lookupBtn').disabled = false;
  setTimeout(()=>{ statusEl.textContent = ''; }, 5000);
}
document.getElementById('lookupBtn').addEventListener('click', doLookup);
document.getElementById('speakPreviewBtn').addEventListener('click', ()=>{
  const w = document.getElementById('inWord').value.trim(); if(w) speakWord(w);
});
document.getElementById('inWord').addEventListener('input', ()=>{
  currentIpa = ''; document.getElementById('ipaRow').style.display = 'none';
});

// --- CRUD ---
async function addWordEntry(data){
  if(!wordsColRef) return;
  try{ await addDoc(wordsColRef, data); }
  catch(e){ alert('저장에 실패했어요: ' + e.message); }
}
async function deleteWord(id){
  if(!wordsColRef) return;
  try{ await deleteDoc(doc(db, wordsColRef.path, id)); }catch(e){}
}
async function updateWord(id, patch){
  const w = words.find(x=>x.id===id); if(!w) return;
  Object.assign(w, patch);
  if(wordsColRef){ try{ await updateDoc(doc(db, wordsColRef.path, id), patch); }catch(e){} }
  renderStats();
}

document.getElementById('addBtn').addEventListener('click', async ()=>{
  const w = document.getElementById('inWord').value.trim();
  if(!w){ alert('영어 단어를 입력해주세요.'); return; }
  let m = document.getElementById('inMeaning').value.trim();
  if(!m){
    await doLookup();
    m = document.getElementById('inMeaning').value.trim();
  }
  if(!m){ alert('사전에서 이 단어의 뜻을 찾지 못했어요. 뜻을 직접 입력해주세요.'); return; }
  const ex = document.getElementById('inExample').value.trim();
  const exKo = document.getElementById('inExampleKo').value.trim();
  const page = document.getElementById('inPage').value.trim();
  await addWordEntry({ word:w, meaning:m, ipa:currentIpa||'', example:ex, exampleKo:exKo, page:page, mastered:false, correctStreak:0, addedAt: Date.now() });
  ['inWord','inMeaning','inExample','inExampleKo','inPage'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('ipaRow').style.display = 'none';
  document.getElementById('exampleSuggestions').innerHTML = '';
  currentIpa = ''; document.getElementById('inWord').focus();
});

// --- Stats / tabs / list ---
function renderStats(){
  document.getElementById('statTotal').textContent = words.length;
  document.getElementById('statMastered').textContent = words.filter(w=>w.mastered).length;
  document.getElementById('statLearning').textContent = words.filter(w=>!w.mastered).length;
}
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
  document.getElementById('panel-add').style.display = name==='add' ? '' : 'none';
  document.getElementById('panel-list').style.display = name==='list' ? '' : 'none';
  document.getElementById('panel-quiz').style.display = name==='quiz' ? '' : 'none';
  if(name==='list') renderList();
  if(name==='quiz') startQuiz();
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click', ()=>switchTab(t.dataset.tab)));

function renderList(){
  const el = document.getElementById('listCard');
  if(words.length===0){ el.innerHTML = '<div class="empty">아직 저장한 단어가 없어요.<br>단어 추가 탭에서 시작해보세요!</div>'; return; }
  el.innerHTML = words.map(w=>`
    <div class="word-item">
      <div style="flex:1;min-width:0;">
        <div class="w-word-row"><span class="w-word">${escapeHtml(w.word)}</span>${w.ipa?`<span class="w-ipa">${escapeHtml(w.ipa)}</span>`:''}<span class="speak-btn" data-speak="${escapeHtml(w.word)}">🔊</span></div>
        <div class="w-meaning">${escapeHtml(w.meaning)}</div>
        ${w.example ? `<div class="w-ex">"${escapeHtml(w.example)}"${w.page?` <span style="opacity:.7;">(${escapeHtml(w.page)})</span>`:''}</div>` : ''}
        ${w.exampleKo ? `<div class="w-ex">→ ${escapeHtml(w.exampleKo)}</div>` : ''}
        <span class="badge">${w.mastered ? '✓ 외움' : '복습 중'}</span>
      </div>
      <button class="del" data-id="${w.id}">삭제</button>
    </div>`).join('');
  el.querySelectorAll('.del').forEach(b=>b.addEventListener('click', ()=>deleteWord(b.dataset.id)));
  el.querySelectorAll('[data-speak]').forEach(b=>b.addEventListener('click', ()=>speakWord(b.dataset.speak)));
}

// --- Quiz ---
let quizPool=[], quizIndex=0, quizScore=0, quizMode='choice';
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function startQuiz(){
  if(words.length===0){ document.getElementById('quizCard').innerHTML='<div class="empty">퀴즈를 풀려면 먼저 단어를 추가해주세요.</div>'; return; }
  const learning = words.filter(w=>!w.mastered);
  quizPool = shuffle(learning.length>=3?learning:words).slice(0,10);
  quizIndex=0; quizScore=0; quizMode = words.length>=4 ? 'choice' : 'flash';
  renderQuizStep();
}
function renderQuizStep(){
  const el = document.getElementById('quizCard');
  if(quizIndex>=quizPool.length){
    el.innerHTML = `<div class="qcard"><div class="qword">🎉 완료!</div><div class="qhint">${quizPool.length}문제 중 ${quizScore}개 맞췄어요</div><button class="btn-main" id="retryBtn">다시 풀기</button></div>`;
    document.getElementById('retryBtn').addEventListener('click', startQuiz);
    return;
  }
  const cur = quizPool[quizIndex];
  const progressHtml = `<div class="progress">${quizIndex+1} / ${quizPool.length}</div>`;
  if(quizMode==='choice'){
    const distractors = shuffle(words.filter(w=>w.id!==cur.id)).slice(0,3).map(w=>w.meaning);
    const options = shuffle([cur.meaning, ...distractors]);
    el.innerHTML = progressHtml + `<div class="qcard"><div class="qword">${escapeHtml(cur.word)} <span class="speak-btn" id="qSpeak">🔊</span></div>${cur.ipa?`<div class="ipa-text" style="margin-bottom:10px;">${escapeHtml(cur.ipa)}</div>`:''}<div class="qhint">이 단어의 뜻은?</div><div id="qfeedback" class="qfeedback"></div><div id="opts">${options.map(o=>`<button class="opt" data-val="${escapeHtml(o)}">${escapeHtml(o)}</button>`).join('')}</div></div>`;
    document.getElementById('qSpeak').addEventListener('click', ()=>speakWord(cur.word));
    document.querySelectorAll('.opt').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const ok = btn.dataset.val === cur.meaning;
        document.querySelectorAll('.opt').forEach(b=>{ b.disabled=true; if(b.dataset.val===cur.meaning) b.classList.add('correct'); else if(b===btn) b.classList.add('wrong'); });
        handleAnswer(cur, ok);
        document.getElementById('qfeedback').textContent = ok ? '정답이에요! 👍' : `아쉬워요. 정답은 "${cur.meaning}"`;
        setTimeout(()=>{ quizIndex++; renderQuizStep(); }, 1100);
      });
    });
  } else {
    el.innerHTML = progressHtml + `<div class="flash" id="flashCard"><div class="qword">${escapeHtml(cur.word)} <span class="speak-btn" id="qSpeak2">🔊</span></div>${cur.ipa?`<div class="ipa-text">${escapeHtml(cur.ipa)}</div>`:''}<div class="qhint">탭해서 뜻 보기</div></div><div class="flashrow" id="flashBtns" style="display:none;"><button class="dontknow" id="btnNo">아직 몰라요</button><button class="know" id="btnYes">알아요!</button></div>`;
    document.getElementById('qSpeak2').addEventListener('click', (e)=>{ e.stopPropagation(); speakWord(cur.word); });
    let flipped=false;
    document.getElementById('flashCard').addEventListener('click', ()=>{
      if(flipped) return; flipped=true;
      document.getElementById('flashCard').innerHTML = `<div class="w-meaning" style="font-size:1.1rem;">${escapeHtml(cur.meaning)}</div>${cur.example?`<div class="w-ex" style="margin-top:8px;">"${escapeHtml(cur.example)}"</div>`:''}${cur.exampleKo?`<div class="w-ex">→ ${escapeHtml(cur.exampleKo)}</div>`:''}`;
      document.getElementById('flashBtns').style.display='flex';
    });
    document.getElementById('btnYes').addEventListener('click', ()=>{ handleAnswer(cur,true); quizIndex++; renderQuizStep(); });
    document.getElementById('btnNo').addEventListener('click', ()=>{ handleAnswer(cur,false); quizIndex++; renderQuizStep(); });
  }
}
function handleAnswer(word, correct){
  const w = words.find(x=>x.id===word.id); if(!w) return;
  let streak = correct ? (w.correctStreak||0)+1 : 0;
  let mastered = correct ? streak>=3 : false;
  quizScore += correct ? 1 : 0;
  updateWord(w.id, { correctStreak: streak, mastered });
}
</script>
