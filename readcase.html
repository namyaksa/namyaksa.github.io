<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>남약사가 읽은 책</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap">
<link rel="stylesheet" href="style.css?v=20261080">
<style>
html,body{margin:0;padding:0;background:transparent;}
body{padding:8px 10px 14px;}
.bookcase-section{margin:0 auto;max-width:640px;}
.bc-note{display:none;}
@keyframes bcShiftBack{from{transform:translateX(var(--shift,50%))}to{transform:translateX(0)}}
@keyframes bcOpenBack{from{transform:rotateY(-180deg)}80%{transform:rotateY(0)}to{transform:rotateY(0)}}
.bc-book.closing{z-index:20;animation:bcShiftBack .7s ease-in-out forwards;}
.bc-book.closing .bc-pages{opacity:1;}
.bc-book.closing .bc-cover{animation:bcOpenBack .7s ease-in-out forwards;}
.bc-slot:has(.bc-book.closing){z-index:30;}
</style>
</head>
<body>
<div class="bookcase-section" id="readCase">
<div class="bc-wrap">
<div class="bc-bar"><div class="bc-bar-title">남약사가 읽은 책</div></div>
<div class="bc" id="readBody"></div>
</div>
</div>
<script>
(function(){
  // 원서가 아닌, 남약사가 읽은 책. 새로 읽은 책은 한 줄씩 추가하세요. (title, year=읽은 때, cover, spread=펼친 쪽 사진, color)
  var BOOKS=[
    {title:'악령이 출몰하는 세상',year:'2026.11.06~',cover:'books/demon-haunted-world.jpg',spread:'books/spread-demon-haunted-world.jpg',url:'https://namyaksa.wixsite.com/paran/%EB%B3%B5%EC%A0%9C-%EC%9B%90%EC%84%9C-%EC%9D%BD%EA%B8%B0#demon',color:'#4a3358'},
    {title:'논리의 기술',year:'',cover:'books/logic-art.jpg',spread:'books/spread-logic-art.jpg',url:'https://namyaksa.wixsite.com/paran/%EB%B3%B5%EC%A0%9C-%EC%9B%90%EC%84%9C-%EC%9D%BD%EA%B8%B0#logic',color:'#555'},
    {title:'문명의 붕괴',year:'',cover:'books/collapse.jpg',spread:'books/spread-collapse.jpg',url:'https://namyaksa.wixsite.com/paran/%EB%B3%B5%EC%A0%9C-%EC%9B%90%EC%84%9C-%EC%9D%BD%EA%B8%B0#collapse',color:'#555'},
    {title:'국가는 왜 실패하는가',year:'',cover:'books/why-nations-fail.jpg',spread:'books/spread-why-nations-fail.jpg',url:'https://namyaksa.wixsite.com/paran/%EB%B3%B5%EC%A0%9C-%EC%9B%90%EC%84%9C-%EC%9D%BD%EA%B8%B0#whynationsfail',color:'#555'},
    {title:'만들어진 신',year:'',cover:'books/god-delusion.jpg',spread:'books/spread-god-delusion.jpg',url:'https://namyaksa.wixsite.com/paran/%EB%B3%B5%EC%A0%9C-%EC%9B%90%EC%84%9C-%EC%9D%BD%EA%B8%B0#delusion',color:'#555'},
    {title:'호모 데우스',year:'',cover:'books/homo-deus.jpg',spread:'books/spread-homo-deus.jpg',url:'https://namyaksa.wixsite.com/paran/%EB%B3%B5%EC%A0%9C-%EC%9B%90%EC%84%9C-%EC%9D%BD%EA%B8%B0#homodeus',color:'#555'},
    {title:'넥서스',year:'',cover:'books/nexus.jpg',spread:'books/spread-nexus.jpg',url:'https://namyaksa.wixsite.com/paran/%EB%B3%B5%EC%A0%9C-%EC%9B%90%EC%84%9C-%EC%9D%BD%EA%B8%B0#nexus',color:'#555'},
    {title:'퀴즈쇼',author:'김영하',year:'',cover:'books/quiz-show.jpg',spread:'books/spread-quiz-show.jpg',url:'https://namyaksa.wixsite.com/paran/%EB%B3%B5%EC%A0%9C-%EC%9B%90%EC%84%9C-%EC%9D%BD%EA%B8%B0#quizshow',color:'#555'},
    {title:'죽음 1',author:'베르나르 베르베르',year:'',cover:'books/death-1.jpg',spread:'books/spread-death-1.jpg',url:'https://namyaksa.wixsite.com/paran/%EB%B3%B5%EC%A0%9C-%EC%9B%90%EC%84%9C-%EC%9D%BD%EA%B8%B0#death',color:'#555'},
    {title:'도시와 그 불확실한 벽',author:'무라카미 하루키',year:'',cover:'books/uncertain-wall.jpg',spread:'books/spread-uncertain-wall.jpg',url:'https://namyaksa.wixsite.com/paran/%EB%B3%B5%EC%A0%9C-%EC%9B%90%EC%84%9C-%EC%9D%BD%EA%B8%B0#uncertain',color:'#555'},
    {title:'직지 1',year:'',cover:'books/jikji-1.jpg',spread:'books/spread-jikji-1.jpg',url:'https://namyaksa.wixsite.com/paran/%EB%B3%B5%EC%A0%9C-%EC%9B%90%EC%84%9C-%EC%9D%BD%EA%B8%B0#jikji',color:'#555'},
    {title:'용의자 X의 헌신',year:'',cover:'books/suspect-x.jpg',spread:'books/spread-suspect-x.jpg',url:'https://namyaksa.wixsite.com/paran/%EB%B3%B5%EC%A0%9C-%EC%9B%90%EC%84%9C-%EC%9D%BD%EA%B8%B0#suspectx',color:'#555'}
  ];
  var ROWS=4, PER=6, body=document.getElementById('readBody'); if(!body) return;
  function closeAll(except){ var o=body.querySelectorAll('.opening'); for(var i=0;i<o.length;i++) if(o[i]!==except) o[i].classList.remove('opening'); }
  body.addEventListener('click',function(e){
    var bk=e.target.closest&&e.target.closest('.bc-book'); if(!bk){ closeAll(); return; }
    var bd=BOOKS[[].indexOf.call(body.querySelectorAll('.bc-book'),bk)]||{};
    if(bk.classList.contains('opening')){ bk.classList.remove('opening'); return; }
    closeAll(bk);
    var rr=bk.getBoundingClientRect(), cc=body.getBoundingClientRect(), w=rr.width;
    var lo=cc.left+6-rr.left+w, hi=cc.right-6-rr.left-w, sh=Math.min(Math.max(w/2,lo),Math.max(hi,lo));
    bk.style.setProperty('--shift',sh+'px'); bk.classList.add('opening');
    if(bd.url){ setTimeout(function(){ try{ window.open(bd.url,'_top'); }catch(e){ location.href=bd.url; } setTimeout(function(){ bk.classList.remove('opening'); },2500); },1300); }
  });
  window.addEventListener('pageshow',function(){ closeAll(); });
  for(var r=0;r<ROWS;r++){
    var row=document.createElement('div'); row.className='bc-row';
    var slots=document.createElement('div'); slots.className='bc-slots';
    for(var c=0;c<PER;c++){
      var slot=document.createElement('div'); slot.className='bc-slot';
      var b=BOOKS[r*PER+c];
      if(b){
        var el=document.createElement('div'); el.className='bc-book'; el.style.cursor='pointer'; el.title=b.title+(b.url?' — 누르면 책 소개로 이동':'');
        if(b.spread){ el.classList.add('has-sp'); el.style.setProperty('--sp','url('+new URL(b.spread,location.href).href+')'); var pg=document.createElement('div'); pg.className='bc-pages'; el.appendChild(pg); }
        if(b.cover){ var im=document.createElement('img'); im.src=b.cover; im.alt=b.title; im.loading='lazy';
          var cv=document.createElement('div'); cv.className='bc-cover'; cv.appendChild(im);
          if(b.spread){ var bb=document.createElement('div'); bb.className='bc-back'; cv.appendChild(bb); }
          el.appendChild(cv); }
        else { el.style.background=b.color; var t=document.createElement('div'); t.className='bc-t'; t.textContent=b.title; el.appendChild(t); }
        slot.appendChild(el);
      }
      slots.appendChild(slot);
    }
    row.appendChild(slots); body.appendChild(row);
    var plank=document.createElement('div'); plank.className='bc-plank';
    for(var k=0;k<PER;k++){ var yr=document.createElement('div'); yr.className='bc-year'; var bk2=BOOKS[r*PER+k]; yr.textContent=(bk2&&bk2.year)?bk2.year:''; if(bk2&&!bk2.year&&bk2.author){ yr.className='bc-author'; yr.textContent=bk2.author; } plank.appendChild(yr); }
    body.appendChild(plank);
  }
})();
</script>
</body>
</html>
